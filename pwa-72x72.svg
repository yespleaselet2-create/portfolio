<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FFFF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#00CCCC;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  <rect width="72" height="72" rx="12" fill="url(#bg)"/>
  <rect width="72" height="72" rx="12" fill="url(#glow)"/>
  <circle cx="36" cy="28" r="12" fill="none" stroke="#00FFFF" stroke-width="2" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="0 75;75 75;0 75" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" values="0;-75;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <rect x="24" y="48" width="24" height="2" rx="1" fill="#00FFFF" opacity="0.8">
    <animate attributeName="width" values="24;12;24" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="24;30;24" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="27" y="52" width="18" height="1" rx="0.5" fill="#00FFFF" opacity="0.5">
    <animate attributeName="width" values="18;9;18" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="27;31.5;27" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  <text x="36" y="66" font-family="monospace" font-size="4" fill="#00FFFF" text-anchor="middle" opacity="0.7">CYBER</text>
</svg>